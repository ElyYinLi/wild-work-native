name: WildWorkNative

options:
  bundleIdPrefix: com.wildwork
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

targets:
  WildWorkNative:
    type: application
    platform: iOS
    sources:
      # Assets.xcassets 由 xcodegen 自动识别为 asset catalog 并加入 Resources
      # build phase（actool → Assets.car）。CI 里另有一步 verify_ipa.py 硬校验
      # Assets.car 与 Info.plist 的 CFBundleIcons，缺失直接让流水线失败，
      # 避免再出现「App 内正常、桌面图标空白」的静默降级。
      - path: WildWorkNative
        excludes:
          - "Resources/**"
    info:
      path: WildWorkNative/Info.plist
      properties:
        CFBundleDisplayName: WildWork
        CFBundleName: WildWork
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: false
        # 网关只监听 127.0.0.1，但仍需允许明文 HTTP
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: 需要本机网络权限以运行内置网关服务。
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wildwork.nativeapp
        PRODUCT_NAME: WildWork
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        ENABLE_BITCODE: NO
        IPHONEOS_DEPLOYMENT_TARGET: "15.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ""
        # Go 运行时依赖 init_array 里的初始化器，dead code stripping 会把它们当成
        # 「没人调用」裁掉，表现为启动即崩。整个 App 只有一份静态库，不必省这点体积。
        DEAD_CODE_STRIPPING: NO
        # Go 静态库（c-archive）由 CI 编译到 Resources/，链接进主 Mach-O。
        # 走静态库而不是子进程：iOS 不允许 exec 未签名二进制，详见 Gateway.swift 注释。
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/WildWorkNative/Resources"
        LIBRARY_SEARCH_PATHS:
          - "$(SRCROOT)/WildWorkNative/Resources"
        SWIFT_OBJC_BRIDGING_HEADER: "WildWorkNative/WildWorkBridge.h"
        OTHER_LDFLAGS:
          - "-lwildwork"
          # Go runtime 在 darwin 上的系统依赖：
          #   -lresolv        net 包的 cgo DNS 解析
          #   -framework Security      crypto/x509 读取系统根证书（SecTrustSettings*）
          #   -framework CoreFoundation
          - "-lresolv"
          - "-framework"
          - "Security"
          - "-framework"
          - "CoreFoundation"
