name: Build Android APK (Native)

on:
  push:
    branches: [ main ]
  schedule:
    # 每天 03:00 UTC 自动跟一次上游，保证包里网关是最新版本
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  UPSTREAM_REPO: rockswang/wild-work
  UPSTREAM_REF: master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify container tweaks parity
        run: python3 scripts/check_panel_tweaks.py

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Fetch upstream source
        run: |
          # 用 tarball 而非 git clone：仓库体积大，浅层 tarball 更快
          curl -fsSL "https://codeload.github.com/${UPSTREAM_REPO}/tar.gz/refs/heads/${UPSTREAM_REF}" -o up.tgz
          mkdir -p upstream
          tar xzf up.tgz -C upstream --strip-components=1
          echo "UPSTREAM_SHA=$(git -C upstream rev-parse HEAD 2>/dev/null || echo unknown)"

      - name: Resolve upstream version
        id: ver
        run: |
          V=$(cat upstream/internal/*/version.go 2>/dev/null | grep -oE '"[0-9]+\.[0-9]+\.[0-9]+"' | head -1 | tr -d '"')
          if [ -z "$V" ]; then
            V=$(curl -fsSL "https://api.github.com/repos/${UPSTREAM_REPO}/releases/latest" | grep -m1 '"tag_name"' | sed -E 's/.*"v?([^"]+)".*/\1/')
          fi
          echo "version=${V:-unknown}" >> $GITHUB_OUTPUT
          echo "网关版本: ${V:-unknown}"

      - name: Build gateway (android/arm64, static)
        working-directory: upstream
        env:
          GOOS: android
          GOARCH: arm64
          CGO_ENABLED: 0
        run: |
          go build -trimpath -ldflags "-s -w" -o ../android/app/src/main/jniLibs/arm64-v8a/libgateway.so ./cmd/wild-work
          ls -lh ../android/app/src/main/jniLibs/arm64-v8a/
          file ../android/app/src/main/jniLibs/arm64-v8a/libgateway.so

      - name: Verify gateway binary
        run: |
          BIN=android/app/src/main/jniLibs/arm64-v8a/libgateway.so
          test -s "$BIN"
          # 交叉编译产物在本机跑不了，只校验 ELF 头与架构，避免静默产出空包
          python3 - <<'PY'
          import struct
          p = "android/app/src/main/jniLibs/arm64-v8a/libgateway.so"
          with open(p, "rb") as f:
              d = f.read(20)
          assert d[:4] == b"\x7fELF", "不是 ELF 文件"
          assert d[4] == 2, "应为 64 位"
          machine = struct.unpack("<H", d[18:20])[0]
          assert machine == 183, f"应为 aarch64(183)，实际 {machine}"
          print("ELF ok: aarch64 64-bit,", len(open(p,'rb').read()), "bytes")
          PY

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build release APK
        run: |
          gradle -p android assembleRelease --no-daemon --stacktrace \
            -PgatewayVersion="${{ steps.ver.outputs.version }}"

      - name: Collect artifact
        run: |
          mkdir -p dist
          APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          echo "found: $APK"
          cp "$APK" dist/WildWorkNative.apk
          ls -lh dist/

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: WildWorkNative-apk
          path: dist/WildWorkNative.apk

      - name: Publish rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Android 最新构建（纯移动端）
          body: |
            网关版本：`${{ steps.ver.outputs.version }}`（上游 ${{ env.UPSTREAM_REPO }}@${{ env.UPSTREAM_REF }}）
            构建提交：`${{ github.sha }}`

            网关已内置，安装后直接可用，**不需要电脑**。
            适配 arm64-v8a 设备（绝大多数现代 Android 手机）。
          files: dist/WildWorkNative.apk
          make_latest: true
